[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools-git-versioning<3"]
build-backend = "setuptools.build_meta"

[project]
name = "zigpy-ziggurat"
dynamic = ["version"]
description = "Zigpy radio library for the Ziggurat server"
urls = {repository = "https://github.com/zigpy/zigpy-ziggurat"}
authors = [
    {name = "puddly", email = "puddly3@gmail.com"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "zigpy",
    "aiohttp",
    "mashumaro",
    "aiospinel>=1.2.0",
]

[project.entry-points."zigpy.radio"]
ziggurat = "zigpy_ziggurat.zigbee.application:ControllerApplication"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*"]

[dependency-groups]
testing = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "uv",
    "tomli",
    "coverage[toml]",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
]
ci = [
    {include-group = "testing"},
    "pytest-github-actions-annotate-failures",
    "pytest-xdist",
]

[tool.setuptools-git-versioning]
enabled = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
required-version = ">=0.5.0"
target-version = "py39"
line-length = 88

exclude = [
    ".venv",
    ".git",
    ".tox",
    "docs",
    "venv",
    "bin",
    "lib",
    "deps",
    "build",
]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.lint.per-file-ignores]
# Fixtures are imported explicitly and referenced only as parameter names
"tests/*.py" = ["F401", "F811"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = [
    "zigpy_ziggurat",
]
combine-as-imports = true
split-on-trailing-comma = false

[tool.codespell]
ignore-words-list = ["hass"]
skip = ["./.*", "tests/*", "pyproject.toml"]
quiet-level = 2

[tool.mypy]
strict = true
show_error_codes = true
show_error_context = true
error_summary = true
# zigpy's integer and struct constructors are unannotated, making nearly every
# zigpy type construction an "untyped call"
disallow_untyped_calls = false

[tool.coverage.run]
source = ["zigpy_ziggurat"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise NotImplementedError()",
]
